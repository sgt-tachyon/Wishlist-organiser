<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wishlist</title>
<style>
:root{--bg:#f5f5f3;--panel:#fff;--ink:#1c1c1e;--muted:#6e6e73;--line:#e4e4df;--hover:#efefeb;--accent:#3b6cf6;--on:#fff;--g1:#2f9e6b;--g2:#d9962a;--g3:#7c5cd6;--none:#9a9aa0;--warn:#b9770e;--err:#c0392b;--sh:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--panel:#212125;--ink:#f2f2f4;--muted:#9b9ba3;--line:#323237;--hover:#2b2b30;--accent:#6b8cff;--on:#0f1226;--warn:#e0a030;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#17171a;--panel:#212125;--ink:#f2f2f4;--muted:#9b9ba3;--line:#323237;--hover:#2b2b30;--accent:#6b8cff;--on:#0f1226;--warn:#e0a030;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-size:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px 0}
.top{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:20px;letter-spacing:-.02em;flex:1}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:12px;font-weight:400;letter-spacing:0}
.ib{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:38px;height:38px;font-size:16px}
.row2{display:flex;gap:8px;margin:10px 0}
.in,.sel{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none;min-width:0}
.in:focus,.sel:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--hover);border-radius:10px;padding:3px;flex:none}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.scroll::-webkit-scrollbar{display:none}
.fch{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 13px;white-space:nowrap}
.fch.on{background:var(--accent);color:var(--on);border-color:transparent}
.fch.add{color:var(--muted);border-style:dashed}
#summary{padding:12px 14px 4px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 13px;min-width:112px}
.chip .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chip .v{font-size:16px;font-weight:650}
.chip.total{background:var(--ink);color:var(--bg);border-color:transparent}
.chip.total .l{color:inherit;opacity:.7}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--none));display:inline-block}
.g1{--c:var(--g1)}.g2{--c:var(--g2)}.g3{--c:var(--g3)}.none{--c:var(--none)}
#content{padding:10px 14px calc(96px + env(safe-area-inset-bottom,0px))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh)}
.card.bought{opacity:.5}
.thumb{position:relative;aspect-ratio:1/1;background:var(--hover);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:28px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.badge{position:absolute;left:8px;top:8px;background:var(--panel);border-radius:20px;padding:2px 9px 2px 7px;font-size:12px;display:flex;align-items:center;gap:6px;box-shadow:var(--sh);z-index:1}
.body{padding:10px 11px 11px;display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.ttl{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:inherit;text-decoration:none;overflow-wrap:anywhere}
a.ttl{color:var(--accent)}
.host{font-size:12px;color:var(--muted);margin-top:-4px}
.sel.s{padding:6px 8px;font-size:14px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.price{font-size:17px;font-weight:700}
.price small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px}
.qty button{border:0;background:none;width:30px;height:30px;font-size:16px;color:var(--muted)}
.qty span{min-width:20px;text-align:center}
.foot{display:flex;align-items:center;gap:4px;margin-top:auto}
.foot .sel{flex:1}
.ico{border:0;background:none;color:var(--muted);width:34px;height:34px;border-radius:8px;font-size:16px}
.ico:active{background:var(--hover)}
.tag{font-size:11px;color:var(--muted);background:var(--hover);padding:2px 8px;border-radius:20px;align-self:flex-start}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.chk input{width:18px;height:18px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.col{background:var(--hover);border-radius:14px;padding:12px}
.col h3{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.col h3 .e{border:0;background:none;color:var(--muted);font-size:14px}
.col .meta{color:var(--muted);font-size:12px;margin:2px 0 10px}
.col .meta b{color:var(--ink);font-size:15px}
.stack{display:flex;flex-direction:column;gap:9px}
.card.compact{flex-direction:row;box-shadow:none}
.card.compact .thumb{width:76px;aspect-ratio:auto;flex:none;font-size:20px}
.card.compact .body{padding:8px 10px;gap:5px}
.card.compact .ttl{font-size:14px;-webkit-line-clamp:1}
.card.compact .price{font-size:15px}
.hint{color:var(--muted);font-size:13px;text-align:center;padding:12px 0}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);margin:0 0 6px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--on);border:0;border-radius:28px;padding:14px 22px;font-weight:650;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:8}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.45)}
@media(max-width:600px){dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.mh{padding:18px 20px 4px;font-size:18px;font-weight:700}
.mb{padding:8px 20px;display:grid;gap:13px;max-height:64vh;overflow:auto}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.pv{display:flex;gap:12px;align-items:center}
.pv img{width:68px;height:68px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--line)}
.pvb{display:flex;gap:8px;flex-wrap:wrap}
.vr{display:flex;gap:8px;margin-bottom:6px}
.vr .in:first-child{flex:2}.vr .in:nth-child(2){flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:10px}
.btn.primary{background:var(--accent);color:var(--on);border-color:transparent;font-weight:600}
.mf{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:10px}
.st{font-size:12px;color:var(--muted);min-height:16px}
.st.err{color:var(--err)}
textarea.in{min-height:130px;font:12px/1.4 ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<header>
  <div class="top"><h1><span>&#9825;</span> Wishlist <span class="sub" id="subtitle"></span></h1>
    <button class="ib" id="bkBtn" title="Backup and restore" aria-label="Backup and restore">&#8645;</button></div>
  <div class="row2"><input id="search" class="in" type="search" placeholder="Search items"><div class="seg" id="seg"><button data-view="gallery">Gallery</button><button data-view="priority">Priority</button></div></div>
  <div class="scroll" id="nav"></div>
</header>
<section id="summary"></section>
<section id="content"></section>
<button class="fab" id="addItem">+ Add item</button>

<dialog id="modal">
  <div class="mh" id="mTitle">Add item</div>
  <div class="mb">
    <div class="f"><label>Name</label><input class="in" id="f_title" placeholder="What do you want?"></div>
    <div class="f"><label>Product link (optional)</label><input class="in" id="f_url" inputmode="url" autocapitalize="off" placeholder="Paste a product link"></div>
    <div class="f"><label>Picture</label>
      <div class="pv"><img id="pvImg" alt="">
        <div class="pvb"><button type="button" class="btn" id="upBtn">Add photo</button><button type="button" class="btn" id="rmImg">Remove</button></div>
        <input type="file" id="f_file" accept="image/*" hidden></div>
      <div class="st">Choose a photo or take one. You can also paste a screenshot.</div></div>
    <div class="row">
      <div class="f"><label>Price (&#8369;)</label><input class="in" id="f_price" inputmode="decimal" placeholder="0.00"></div>
      <div class="f"><label>Quantity</label><input class="in" id="f_qty" type="number" inputmode="numeric" min="1" value="1"></div>
    </div>
    <div class="f"><label>Variants (size, colour, pack). Each can have its own price.</label><div id="vlist"></div><button type="button" class="btn" id="addVar">+ Add variant</button></div>
    <div class="row">
      <div class="f"><label>Folder</label><select class="sel" id="f_folder"></select></div>
      <div class="f"><label>Priority group</label><select class="sel" id="f_group"></select></div>
    </div>
    <div class="st" id="mst"></div>
  </div>
  <div class="mf"><button type="button" class="btn" id="mCancel">Cancel</button><button type="button" class="btn primary" id="mSave">Save item</button></div>
</dialog>

<dialog id="ask"><div class="mh" id="askT"></div><div class="mb"><div id="askM"></div><input class="in" id="askI"></div><div class="mf"><button type="button" class="btn" id="askNo">Cancel</button><button type="button" class="btn primary" id="askOk">OK</button></div></dialog>

<dialog id="bk">
  <div class="mh">Backup and restore</div>
  <div class="mb">
    <div class="st">Your wishlist is stored in this browser on this device. Copy the backup text to keep a spare copy or to move the list to another device, then paste it here to restore.</div>
    <textarea class="in" id="bkText" spellcheck="false"></textarea>
    <div class="st" id="bkSt"></div>
  </div>
  <div class="mf"><button type="button" class="btn" id="bkClose">Close</button><button type="button" class="btn" id="bkRestore">Restore from text</button><button type="button" class="btn primary" id="bkCopy">Copy backup</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP'}).format(x||0);
const n=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const uid=()=>Math.random().toString(36).slice(2,10);
const GROUPS=['g1','g2','g3','none'],KEY='wishlist_v1';
let S,ui={q:'',adding:false},editing=null;

const defaults=()=>({folders:[],groups:[{id:'g1',name:'Buy first'},{id:'g2',name:'Can wait'},{id:'g3',name:'Buy last'}],items:[],ui:{folder:'all',view:'gallery'}});
const gname=id=>id==='none'?'Unsorted':((S.groups.find(g=>g.id===id)||{}).name||id);
const gid=it=>GROUPS.includes(it.group)?it.group:'none';
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return ''}};
const hasP=v=>v&&v.price!==''&&v.price!=null&&isFinite(parseFloat(v.price));
const unit=it=>{const v=(it.variants||[])[it.variant];return hasP(v)?parseFloat(v.price):n(it.price)};
const line=it=>unit(it)*(it.qty||1);
const counted=it=>!it.bought;

/* ---- storage (this browser only) ---- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){dlg('Could not save','Storage may be full or blocked. Remove some photos or make a backup.',false,'','OK')}}
function load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):{}}catch{return {}}}

/* ---- render ---- */
function scope(){const f=S.ui.folder,q=ui.q.toLowerCase();return S.items.filter(i=>(f==='all'||i.folderId===f)&&(!q||(i.title||'').toLowerCase().includes(q)))}
function render(){renderNav();renderSummary();renderContent();
  const c=scope().length;$('#subtitle').textContent=c+(c===1?' item':' items');
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.view===S.ui.view))}
function renderNav(){
  const f=S.ui.folder;
  let h=`<button class="fch ${f==='all'?'on':''}" data-act="folder" data-id="all">All items</button>`+
  S.folders.map(x=>`<button class="fch ${f===x.id?'on':''}" data-act="folder" data-id="${x.id}">${esc(x.name)}</button>`).join('');
  if(f!=='all')h+=`<button class="fch add" data-act="renfolder">Rename</button><button class="fch add" data-act="delfolder">Delete</button>`;
  h+=`<button class="fch add" data-act="newfolder">+ Folder</button>`;
  $('#nav').innerHTML=h;
  const on=$('#nav .on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'nearest',block:'nearest'});
}
function renderSummary(){
  const items=scope().filter(counted);
  let h=`<div class="chip total"><div class="l">Total to buy</div><div class="v">${fmt(items.reduce((a,i)=>a+line(i),0))}</div></div>`;
  for(const g of GROUPS){const its=items.filter(i=>gid(i)===g);if(g==='none'&&!its.length)continue;
    h+=`<div class="chip ${g}"><div class="l"><span class="dot"></span>${esc(gname(g))}</div><div class="v">${fmt(its.reduce((a,i)=>a+line(i),0))}</div></div>`}
  $('#summary').innerHTML=h;
}
function card(it,compact){
  const vs=it.variants||[];
  const vsel=vs.length?`<select class="sel s" aria-label="Variant" data-f="variant" data-id="${it.id}">${vs.map((v,i)=>`<option value="${i}" ${i===it.variant?'selected':''}>${esc(v.name)}${hasP(v)?' · '+fmt(parseFloat(v.price)):''}</option>`).join('')}</select>`:'';
  const g=gid(it),fo=S.folders.find(x=>x.id===it.folderId),u=unit(it),q=it.qty||1;
  const thumb=`<div class="thumb">&#9825;${it.image?`<img src="${esc(it.image)}" alt="" onerror="this.remove()">`:''}${!compact?`<span class="badge ${g}"><span class="dot"></span>${esc(gname(g))}</span>`:''}</div>`;
  const title=it.url?`<a class="ttl" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title||'Untitled')}</a>`:`<span class="ttl">${esc(it.title||'Untitled')}</span>`;
  const qty=`<div class="qty"><button aria-label="Less" data-act="dec" data-id="${it.id}">&minus;</button><span>${q}</span><button aria-label="More" data-act="inc" data-id="${it.id}">+</button></div>`;
  const price=`<div class="price">${fmt(u*q)}${q>1?`<small>${fmt(u)} each</small>`:''}</div>`;
  const gsel=`<select class="sel s" aria-label="Priority group" data-f="group" data-id="${it.id}">${GROUPS.map(x=>`<option value="${x}" ${x===g?'selected':''}>${esc(gname(x))}</option>`).join('')}</select>`;
  const chk=`<label class="chk"><input type="checkbox" data-f="bought" data-id="${it.id}" ${it.bought?'checked':''}>${compact?'Bought':'Already bought'}</label>`;
  if(compact)return `<article class="card compact ${it.bought?'bought':''}">${thumb}<div class="body">${title}${vsel}<div class="prow">${price}${qty}</div>${gsel}
    <div class="foot">${chk}<span style="flex:1"></span><button class="ico" aria-label="Edit" data-act="edit" data-id="${it.id}">&#9998;</button></div></div></article>`;
  return `<article class="card ${it.bought?'bought':''}">${thumb}<div class="body">${title}${it.url?`<div class="host">${esc(host(it.url))}</div>`:''}${vsel}
    <div class="prow">${price}${qty}</div>${fo&&S.ui.folder==='all'?`<span class="tag">${esc(fo.name)}</span>`:''}
    <div class="foot">${gsel}<button class="ico" aria-label="Edit" data-act="edit" data-id="${it.id}">&#9998;</button><button class="ico" aria-label="Delete" data-act="del" data-id="${it.id}">&times;</button></div>${chk}</div></article>`;
}
function renderContent(){
  const items=scope(),el=$('#content');
  if(!items.length){el.innerHTML=`<div class="empty"><h2>${S.items.length?'Nothing here':'Your wishlist is empty'}</h2><div>${S.items.length?'Try another folder or search.':'Tap “Add item” to add your first product.'}</div></div>`;return}
  if(S.ui.view==='gallery'){
    el.innerHTML=`<div class="grid">${[...items].sort((a,b)=>GROUPS.indexOf(gid(a))-GROUPS.indexOf(gid(b))).map(i=>card(i,false)).join('')}</div>`;return}
  let run=0;
  el.innerHTML=`<div class="board">${GROUPS.map(g=>{
    const its=items.filter(i=>gid(i)===g);if(g==='none'&&!its.length)return '';
    const sub=its.filter(counted).reduce((a,i)=>a+line(i),0);if(g!=='none')run+=sub;
    return `<div class="col ${g}"><h3><span class="dot"></span>${esc(gname(g))}${g!=='none'?`<button class="e" aria-label="Rename group" data-act="rengroup" data-id="${g}">&#9998;</button>`:''}</h3>
      <div class="meta"><b>${fmt(sub)}</b> · ${its.length} item${its.length===1?'':'s'}${g!=='none'?`<br>Running total: ${fmt(run)}`:''}</div>
      <div class="stack">${its.map(i=>card(i,true)).join('')||'<div class="hint">No items in this group</div>'}</div></div>`}).join('')}</div>`;
}

/* ---- in-page prompts (browser prompt/confirm are blocked here) ---- */
const ask=$('#ask');
function dlg(title,msg,withInput,val,okLabel){return new Promise(res=>{
  $('#askT').textContent=title;$('#askM').textContent=msg||'';
  const i=$('#askI');i.style.display=withInput?'':'none';i.value=val||'';
  $('#askOk').textContent=okLabel||'OK';
  let done=false;const fin=v=>{if(done)return;done=true;if(ask.open)ask.close();res(v)};
  $('#askOk').onclick=()=>fin(withInput?i.value:true);
  $('#askNo').onclick=()=>fin(withInput?null:false);
  i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();fin(i.value)}};
  ask.onclose=()=>fin(withInput?null:false);
  ask.onclick=e=>{if(e.target===ask)fin(withInput?null:false)};
  ask.showModal();if(withInput)i.focus();
})}
const prompt2=(t,v)=>dlg(t,'',true,v,'Save');
const confirm2=(m,ok)=>dlg('Please confirm',m,false,'',ok||'Delete');

/* ---- events ---- */
document.addEventListener('click',async e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const id=a.dataset.id,act=a.dataset.act,it=S.items.find(i=>i.id===id),f=S.folders.find(x=>x.id===S.ui.folder);
  if(act==='folder'){S.ui.folder=id;save();render()}
  else if(act==='newfolder'){const v=await prompt2('New folder','');if(v&&v.trim()){const nid=uid();S.folders.push({id:nid,name:v.trim()});S.ui.folder=nid;save();render()}}
  else if(act==='renfolder'&&f){const v=await prompt2('Rename folder',f.name);if(v&&v.trim()){f.name=v.trim();save();render()}}
  else if(act==='delfolder'&&f){if(await confirm2(`Delete folder “${f.name}”? Its items stay in All items.`)){S.items.forEach(i=>{if(i.folderId===f.id)i.folderId=null});S.folders=S.folders.filter(x=>x.id!==f.id);S.ui.folder='all';save();render()}}
  else if(act==='rengroup'){const g=S.groups.find(x=>x.id===id);const v=await prompt2('Rename group',g.name);if(v&&v.trim()){g.name=v.trim();save();render()}}
  else if(act==='edit')openModal(id);
  else if(act==='del'){if(await confirm2(`Remove “${it.title||'this item'}”?`)){S.items=S.items.filter(i=>i.id!==id);save();render()}}
  else if(act==='inc'){it.qty=(it.qty||1)+1;save();render()}
  else if(act==='dec'){it.qty=Math.max(1,(it.qty||1)-1);save();render()}
});
document.addEventListener('change',e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;const it=S.items.find(i=>i.id===t.dataset.id);if(!it)return;
  if(f==='variant')it.variant=parseInt(t.value);
  if(f==='group')it.group=t.value;
  if(f==='bought')it.bought=t.checked;
  save();render();
});
$('#seg').onclick=e=>{const b=e.target.closest('button');if(b){S.ui.view=b.dataset.view;save();render()}};
$('#search').oninput=e=>{ui.q=e.target.value;render()};
$('#addItem').onclick=()=>openModal(null);

/* ---- add / edit ---- */
const modal=$('#modal');
function varRow(v={name:'',price:''}){
  const d=document.createElement('div');d.className='vr';
  d.innerHTML=`<input class="in" placeholder="e.g. Large / Black" value="${esc(v.name)}"><input class="in" inputmode="decimal" placeholder="Price" value="${v.price==null?'':esc(v.price)}"><button type="button" class="ico" aria-label="Remove variant">&times;</button>`;
  d.querySelector('button').onclick=()=>d.remove();$('#vlist').appendChild(d)}
function setImg(v){modal._img=v||'';const i=$('#pvImg');i.style.visibility=v?'visible':'hidden';if(v)i.src=v}
function mst(t,err){const s=$('#mst');s.textContent=t||'';s.className='st'+(err?' err':'')}
function loadPhoto(file){
  if(!file||!file.type.startsWith('image/'))return;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const k=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);setImg(c.toDataURL('image/jpeg',0.8));mst('')};
  img.onerror=()=>{URL.revokeObjectURL(url);mst('Could not read that image.',true)};
  img.src=url}
$('#upBtn').onclick=()=>$('#f_file').click();
$('#f_file').onchange=e=>{loadPhoto(e.target.files[0]);e.target.value=''};
$('#rmImg').onclick=()=>setImg('');
document.addEventListener('paste',e=>{if(!modal.open)return;const f=[...(e.clipboardData?e.clipboardData.items:[])].find(i=>i.type.startsWith('image/'));if(f){e.preventDefault();loadPhoto(f.getAsFile())}});
function openModal(id){
  editing=id?S.items.find(i=>i.id===id):null;
  const it=editing||{url:'',title:'',image:'',price:'',qty:1,variants:[],variant:0,folderId:S.ui.folder==='all'?null:S.ui.folder,group:'none'};
  $('#mTitle').textContent=editing?'Edit item':'Add item';
  $('#f_url').value=it.url||'';$('#f_title').value=it.title||'';setImg(it.image);
  $('#f_price').value=it.price===''||it.price==null?'':it.price;$('#f_qty').value=it.qty||1;
  $('#vlist').innerHTML='';(it.variants||[]).forEach(varRow);
  $('#f_folder').innerHTML=`<option value="">All items only</option>`+S.folders.map(f=>`<option value="${f.id}" ${f.id===it.folderId?'selected':''}>${esc(f.name)}</option>`).join('');
  $('#f_group').innerHTML=GROUPS.map(g=>`<option value="${g}" ${g===gid(it)?'selected':''}>${esc(gname(g))}</option>`).join('');
  modal._variant=it.variant||0;mst('');modal.showModal();
}
$('#addVar').onclick=()=>varRow();
$('#mCancel').onclick=()=>modal.close();
$('#mSave').onclick=()=>{
  let url=$('#f_url').value.trim(),title=$('#f_title').value.trim();
  if(!title&&!url){mst('Add a name or a link first.',true);return}
  if(url&&!/^https?:\/\//i.test(url))url='https://'+url;
  if(!title)title=host(url)||'Untitled';
  const variants=[...document.querySelectorAll('#vlist .vr')].map(r=>{const i=r.querySelectorAll('input');return{name:i[0].value.trim(),price:i[1].value.trim()}}).filter(v=>v.name);
  const o=editing||{id:uid(),added:Date.now(),bought:false};
  Object.assign(o,{url,title,image:modal._img||'',price:$('#f_price').value.trim(),qty:Math.max(1,parseInt($('#f_qty').value)||1),variants,
    variant:variants.length?Math.min(modal._variant||0,variants.length-1):0,folderId:$('#f_folder').value||null,group:$('#f_group').value});
  if(!editing)S.items.unshift(o);
  save();render();modal.close();
};
modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});

/* ---- backup ---- */
const bk=$('#bk'),bs=(t,err)=>{const s=$('#bkSt');s.textContent=t||'';s.className='st'+(err?' err':'')};
$('#bkBtn').onclick=()=>{$('#bkText').value=JSON.stringify(S);bs('');bk.showModal()};
$('#bkClose').onclick=()=>bk.close();
$('#bkCopy').onclick=async()=>{const t=$('#bkText');t.value=JSON.stringify(S);
  try{await navigator.clipboard.writeText(t.value);bs('Backup copied.')}catch{t.select();bs('Select all and copy the text above.')}};
$('#bkRestore').onclick=async()=>{
  try{const d=JSON.parse($('#bkText').value);if(!d||!Array.isArray(d.items))throw 0;
    if(!(await confirm2('Replace your current wishlist with this backup?','Replace')))return;
    S=Object.assign(defaults(),d);S.ui=Object.assign({folder:'all',view:'gallery'},S.ui||{});save();render();bk.close()}
  catch{bs('That text isn’t a valid backup.',true)}};
bk.addEventListener('click',e=>{if(e.target===bk)bk.close()});

/* ---- start ---- */
S=Object.assign(defaults(),load());S.ui=Object.assign({folder:'all',view:'gallery'},S.ui||{});
if(S.ui.folder!=='all'&&!S.folders.some(f=>f.id===S.ui.folder))S.ui.folder='all';
render();
</script>
</body>
</html>
